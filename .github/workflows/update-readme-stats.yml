name: Update README stats

on:
  schedule:
    - cron: "0 * * * *" # every hour at :00
  workflow_dispatch: # allow manual trigger from GitHub Actions UI

permissions:
  contents: write # needed to push the README change back

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use GITHUB_TOKEN so the push is authenticated
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install GA4 client library
        run: npm install @google-analytics/data

      - name: Fetch stats & update README
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/update-readme-stats.js

      - name: Commit & push if README changed
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (
            git add README.md &&
            git commit -m "chore: update live GA4 stats in README [skip ci]" &&
            git push
          )
